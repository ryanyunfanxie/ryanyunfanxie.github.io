    name: Terralix Smart Ski Goggles
    role: Software Developer
    period: 2026 – Present
    summary: Bringing AI to the slopes through on-device computing and terrain perception.
    highlights:
      - Deployed models on the RK3588 board for edge AI computing.
      - Exploring LiDAR-based algorithms for snow terrain recognition.
  - id: robomaster
    name: HKUST RoboMaster Team ENTERPRIZE
    role: Embedded Developer
    period: 2025 – Present
    summary: Developing the embedded control system for an autonomous Sentry robot.
    highlights:
      - Led embedded development for the Sentry robot, creating core control logic for autonomous decision-making and developing algorithms for navigation and target tracking.
      - Improved IMU fusion and AHRS algorithms, reducing response latency by 60% and increasing control precision by 30%.
      - Collaborated with mechanical and hardware teams to integrate sensors and motors.
  - id: ustleaf
    name: USTLeaf
    role: Full-Stack Developer
    period: 2024 – 2025
    summary: A community platform for discovering and documenting plant species on the HKUST campus.
    highlights:
      - Built and deployed ustleaf.cloud with peers, cataloging campus plant species with photographs and detailed information.
      - Added community features for photo uploads, comments, and likes.
    url: https://ustleaf.cloud
    link_label: Visit USTLeaf

