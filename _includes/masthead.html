<header class="masthead">
  <nav class="masthead__inner" aria-label="Page sections">
    <ul class="nav-links">
      {% for link in site.data.navigation.main %}
      <li class="nav-link{% if forloop.index > 2 %} nav-link--secondary{% endif %}"><a href="{% unless page.url == '/' %}{{ '/' | relative_url }}{% endunless %}{{ link.url }}">{{ link.title }}</a></li>
      {% endfor %}
      <li><button id="theme-toggle" class="icon-button" type="button" aria-label="Toggle color theme"><span id="theme-icon" class="theme-icon" aria-hidden="true"><img class="theme-icon__sun" src="{{ '/assets/icons/sun.svg' | relative_url }}" alt=""><img class="theme-icon__moon" src="{{ '/assets/icons/moon.svg' | relative_url }}" alt=""></span></button></li>
      <li><button id="menu-toggle" class="icon-button menu-toggle" type="button" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="mobile-menu"><span class="menu-icon" aria-hidden="true"><img src="{{ '/assets/icons/menu.svg' | relative_url }}" alt=""></span></button></li>
    </ul>
    <ul id="mobile-menu" class="mobile-menu" hidden>
      {% for link in site.data.navigation.main %}<li><a href="{% unless page.url == '/' %}{{ '/' | relative_url }}{% endunless %}{{ link.url }}">{{ link.title }}</a></li>{% endfor %}
    </ul>
  </nav>
</header>
